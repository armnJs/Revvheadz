<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root {
        --primary-color: #1173d4;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
</head>

<body>
    <div class="relative flex size-full min-h-screen flex-col bg-[#111418] dark group/design-root overflow-x-hidden"
        style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');">
        <div class="layout-container flex h-full grow flex-col">
            <header
                class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#283039] px-10 py-4">
                <div class="flex items-center gap-4 text-white">
                    <div class="size-6 text-[var(--primary-color)]">
                        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"
                                fill="currentColor"></path>
                        </svg>
                    </div>
                    <h1 class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">RevvHeadz</h1>
                </div>
                <nav class="flex items-center gap-8">
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Dashboard</a>
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Vehicles</a>
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Maintenance</a>
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Fuel</a>
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Expenses</a>
                    <a class="text-gray-300 hover:text-white text-sm font-medium leading-normal transition-colors"
                        href="#">Reports</a>
                </nav>
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDhPQrPfh9Y-YeB_DLkpGbL6R6hkfu1ALREjG_SKXuEH6OEGpXAe0UZ9IOvbMS6JG-bCn9jVyk33bUrMgZkCSbcA_PD4vzU4dSMdQvT76f9fwivG7hRNfS6TMIOGL9l6SoKTYUMntAE4JaZ3zvUsaUc1lnWFBxRdx8e1MPCIoT67hcmD5ZMgfYRtSoF3mHPXMJKz8J2g7s5yMCbEuPJjSR3HRlo4VCyIQ6jOxJApGp0GfSxy9ZnXHgYTI-747Iuew_BaavslOyUACA");'>
                </div>
            </header>
            <main class="flex-1 px-10 py-8">
                <div class="mx-auto max-w-4xl">
                    <h2 class="text-white text-3xl font-bold leading-tight tracking-tight">Profile &amp; Settings</h2>
                    <div class="mt-8 grid grid-cols-1 gap-12">
                        <section>
                            <h3 class="text-white text-xl font-semibold leading-tight tracking-tight">Personal Details
                            </h3>
                            <div class="mt-6 grid grid-cols-1 gap-6 sm:grid-cols-2">
                                <div class="flex flex-col">
                                    <label class="text-gray-300 text-sm font-medium leading-normal pb-2"
                                        for="fullName">Full Name</label>
                                    <input
                                        class="form-input w-full rounded-md border border-[#3b4754] bg-[#1c2127] px-4 py-3 text-white placeholder:text-gray-500 focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                                        id="fullName" placeholder="Enter your full name" />
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-gray-300 text-sm font-medium leading-normal pb-2"
                                        for="email">Email</label>
                                    <input
                                        class="form-input w-full rounded-md border border-[#3b4754] bg-[#1c2127] px-4 py-3 text-white placeholder:text-gray-500 focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                                        id="email" placeholder="Enter your email" type="email" />
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-gray-300 text-sm font-medium leading-normal pb-2"
                                        for="phoneNumber">Phone Number</label>
                                    <input
                                        class="form-input w-full rounded-md border border-[#3b4754] bg-[#1c2127] px-4 py-3 text-white placeholder:text-gray-500 focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                                        id="phoneNumber" placeholder="Enter your phone number" />
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-gray-300 text-sm font-medium leading-normal pb-2"
                                        for="address">Address</label>
                                    <input
                                        class="form-input w-full rounded-md border border-[#3b4754] bg-[#1c2127] px-4 py-3 text-white placeholder:text-gray-500 focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                                        id="address" placeholder="Enter your address" />
                                </div>
                            </div>
                        </section>
                        <section>
                            <h3 class="text-white text-xl font-semibold leading-tight tracking-tight">Notification
                                Preferences</h3>
                            <div class="mt-6 space-y-4">
                                <label class="flex items-center gap-x-3">
                                    <input checked=""
                                        class="h-5 w-5 rounded-md border-[#3b4754] border-2 bg-transparent text-[var(--primary-color)] checked:bg-[var(--primary-color)] checked:border-[var(--primary-color)] checked:bg-[image:--checkbox-tick-svg] focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111418] focus:ring-[var(--primary-color)] focus:outline-none"
                                        type="checkbox" />
                                    <span class="text-gray-300 text-sm font-normal leading-normal">Receive email
                                        notifications for upcoming maintenance</span>
                                </label>
                                <label class="flex items-center gap-x-3">
                                    <input
                                        class="h-5 w-5 rounded-md border-[#3b4754] border-2 bg-transparent text-[var(--primary-color)] checked:bg-[var(--primary-color)] checked:border-[var(--primary-color)] checked:bg-[image:--checkbox-tick-svg] focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111418] focus:ring-[var(--primary-color)] focus:outline-none"
                                        type="checkbox" />
                                    <span class="text-gray-300 text-sm font-normal leading-normal">Receive SMS
                                        notifications for low fuel alerts</span>
                                </label>
                                <label class="flex items-center gap-x-3">
                                    <input checked=""
                                        class="h-5 w-5 rounded-md border-[#3b4754] border-2 bg-transparent text-[var(--primary-color)] checked:bg-[var(--primary-color)] checked:border-[var(--primary-color)] checked:bg-[image:--checkbox-tick-svg] focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111418] focus:ring-[var(--primary-color)] focus:outline-none"
                                        type="checkbox" />
                                    <span class="text-gray-300 text-sm font-normal leading-normal">Receive in-app
                                        notifications for expense tracking reminders</span>
                                </label>
                            </div>
                        </section>
                        <section>
                            <h3 class="text-white text-xl font-semibold leading-tight tracking-tight">Account Management
                            </h3>
                            <div class="mt-6 flex flex-col items-start gap-4 sm:flex-row sm:items-center">
                                <button
                                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-10 px-4 bg-[#283039] text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-[#3b4754] transition-colors">
                                    <span class="truncate">Change Password</span>
                                </button>
                                <button
                                    class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-10 px-4 text-red-500 text-sm font-bold leading-normal tracking-[0.015em] hover:bg-red-500/10 transition-colors">
                                    <span class="truncate">Delete Account</span>
                                </button>
                            </div>
                        </section>
                    </div>
                    <div class="mt-12 flex justify-end">
                        <button
                            class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-12 px-6 bg-[var(--primary-color)] text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-blue-700 transition-colors">
                            <span class="truncate">Save Changes</span>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
