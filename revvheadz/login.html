<html>

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body class="bg-[#111418]">
    <div class="relative flex size-full min-h-screen flex-col bg-[#111418] dark group/design-root overflow-x-hidden"
        style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(255,255,255)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e'); font-family: Inter, &quot;Noto Sans&quot;, sans-serif;">
        <div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
            <div class="w-full max-w-md space-y-8">
                <div>
                    <div class="flex items-center justify-center gap-4 text-white mb-6">
                        <svg class="h-10 w-auto text-[#1173d4]" fill="none" viewBox="0 0 48 48"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"
                                fill="currentColor"></path>
                        </svg>
                        <h2 class="text-white text-3xl font-bold tracking-tight">RevvHeadz</h2>
                    </div>
                    <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-white">Welcome back</h2>
                    <p class="mt-2 text-center text-sm text-gray-400">
                        New to RevvHeadz?
                        <a class="font-medium text-[#1173d4] hover:text-[#1173d4]/90" href="#">
                            Create an account
                        </a>
                    </p>
                </div>
                <form action="#" class="mt-8 space-y-6" method="POST">
                    <div class="rounded-md shadow-sm -space-y-px">
                        <div>
                            <label class="sr-only" for="email-address">Email or Username</label>
                            <input autocomplete="email"
                                class="form-input relative block w-full appearance-none rounded-t-md border border-gray-700 bg-[#283039] px-3 py-4 text-white placeholder-gray-500 focus:z-10 focus:border-[#1173d4] focus:outline-none focus:ring-[#1173d4] sm:text-sm"
                                id="email-address" name="email" placeholder="Email or Username" required=""
                                type="email" />
                        </div>
                        <div>
                            <label class="sr-only" for="password">Password</label>
                            <input autocomplete="current-password"
                                class="form-input relative block w-full appearance-none rounded-b-md border border-gray-700 bg-[#283039] px-3 py-4 text-white placeholder-gray-500 focus:z-10 focus:border-[#1173d4] focus:outline-none focus:ring-[#1173d4] sm:text-sm"
                                id="password" name="password" placeholder="Password" required="" type="password" />
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input
                                class="h-4 w-4 rounded border-gray-600 bg-gray-700 text-[#1173d4] focus:ring-[#1173d4] focus:ring-offset-gray-800"
                                id="remember-me" name="remember-me" type="checkbox" />
                            <label class="ml-2 block text-sm text-gray-300" for="remember-me">Remember me</label>
                        </div>
                        <div class="text-sm">
                            <a class="font-medium text-[#1173d4] hover:text-[#1173d4]/90" href="#">Forgot your
                                password?</a>
                        </div>
                    </div>
                    <div>
                        <button
                            class="group relative flex w-full justify-center rounded-md border border-transparent bg-[#1173d4] py-3 px-4 text-sm font-medium text-white hover:bg-[#1173d4]/90 focus:outline-none focus:ring-2 focus:ring-[#1173d4] focus:ring-offset-2 focus:ring-offset-gray-800"
                            type="submit">
                            Log In
                        </button>
                    </div>
                </form>
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-700"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="bg-[#111418] px-2 text-gray-400">Or continue with</span>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <button
                        class="inline-flex w-full justify-center items-center gap-2 rounded-md border border-gray-700 bg-[#283039] py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-gray-700/50"
                        type="button">
                        <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                            <path clip-rule="evenodd"
                                d="M10 0C4.477 0 0 4.477 0 10c0 4.425 2.865 8.165 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.031-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0110 4.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.03 1.595 1.03 2.688 0 3.848-2.338 4.695-4.566 4.942.359.308.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.578.688.482A10.001 10.001 0 0020 10c0-5.523-4.477-10-10-10z"
                                fill-rule="evenodd"></path>
                        </svg>
                        <span>Continue with Social Platform</span>
                    </button>
                    <button
                        class="inline-flex w-full justify-center items-center gap-2 rounded-md border border-gray-700 bg-[#283039] py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-gray-700/50"
                        type="button">
                        <svg aria-hidden="true" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M22.5,12.1c0-.8-.1-1.5-.2-2.2H12v4.2h5.9c-.3,1.4-1.1,2.5-2.3,3.3v2.8h3.6c2.1-1.9,3.3-4.6,3.3-7.9Z"
                                style="fill: #4285f4;"></path>
                            <path
                                d="M12,23c3.2,0,5.9-1.1,7.9-2.9l-3.6-2.8c-1.1,.7-2.4,1.2-4.3,1.2-3.3,0-6.1-2.2-7.1-5.2H1.3v2.9C3.3,20.1,7.3,23,12,23Z"
                                style="fill: #34a853;"></path>
                            <path
                                d="M4.9,13.8c-.2-.7-.2-1.4-.2-2.1s0-1.5,.2-2.1V6.7H1.3c-.7,1.4-1.1,3-1.1,4.6s.4,3.2,1.1,4.6l3.6-2.8Z"
                                style="fill: #fbbc05;"></path>
                            <path
                                d="M12,4.8c1.7,0,3.1,.6,4.2,1.6l3.2-3.2C17.9,1.1,15.2,0,12,0,7.3,0,3.3,2.9,1.3,7.1l3.6,2.9c1-3,3.8-5.2,7.1-5.2Z"
                                style="fill: #ea4335;"></path>
                        </svg>
                        <span>Continue with Another Social Platform</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
