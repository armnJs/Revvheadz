<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style"
        href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <title>RevvHeadz - Fuel Management</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root {
        --primary-color: #1173d4;
      }
    </style>
</head>

<body class="bg-gray-900 text-white" style='font-family: Inter, "Noto Sans", sans-serif;'>
    <div class="relative flex size-full min-h-screen flex-col overflow-x-hidden">
        <header
            class="sticky top-0 z-10 flex items-center justify-between whitespace-nowrap border-b border-solid border-gray-800 bg-gray-900/80 px-10 py-3 backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="text-[var(--primary-color)] size-8">
                    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"
                            fill="currentColor"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">RevvHeadz</h1>
            </div>
            <nav class="flex items-center gap-8">
                <div class="hidden items-center gap-6 md:flex">
                    <a class="text-sm font-medium text-gray-300 hover:text-white" href="#">Dashboard</a>
                    <a class="text-sm font-medium text-gray-300 hover:text-white" href="#">Vehicles</a>
                    <a class="text-sm font-medium text-white" href="#">Fuel</a>
                    <a class="text-sm font-medium text-gray-300 hover:text-white" href="#">Maintenance</a>
                    <a class="text-sm font-medium text-gray-300 hover:text-white" href="#">Expenses</a>
                    <a class="text-sm font-medium text-gray-300 hover:text-white" href="#">Analytics</a>
                </div>
                <div class="flex items-center gap-4">
                    <button class="rounded-full p-2 text-gray-300 hover:bg-gray-800 hover:text-white">
                        <span class="sr-only">View notifications</span>
                        <svg fill="currentColor" height="20px" viewBox="0 0 256 256" width="20px"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z">
                            </path>
                        </svg>
                    </button>
                    <button>
                        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDwdYXhkzAvJp0Im9BulgWdfFS6wY7tVstKMhfih7axiC7ewIPrciD_v34KUd9QXLy-DAme3xu5lmDU4oKP8gVeAV1c0dXa1rttkt7QWD5EDWhTe4phE970_yoMEx9OdI8UaZNXgPCuXwEivd2LceUqE3ZpmzN_1_WT_fnR2sC5DKSJK_7-I385O8AmmA-rTG473mceLJA3NLuk9_HJmGZiRIemKHnexfkB2O7Pxzps8DqgKssWpqumKcR59p4jfLGhb7RRIoPsBT8");'>
                        </div>
                    </button>
                </div>
            </nav>
        </header>
        <main class="flex flex-1">
            <div class="fixed top-16 bottom-0 w-80 overflow-y-auto border-r border-gray-800 bg-gray-900 p-6">
                <form class="space-y-6">
                    <h2 class="text-xl font-bold">Add Fuel Entry</h2>
                    <div>
                        <label class="block text-sm font-medium text-gray-300" for="date">Date</label>
                        <input
                            class="form-input mt-1 block w-full rounded-md border-gray-700 bg-gray-800 text-white shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                            id="date" type="date" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300" for="km-reading">Kilometer
                            Reading</label>
                        <input
                            class="form-input mt-1 block w-full rounded-md border-gray-700 bg-gray-800 text-white placeholder-gray-500 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                            id="km-reading" placeholder="e.g., 65432" type="number" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300" for="liters">Liters</label>
                        <input
                            class="form-input mt-1 block w-full rounded-md border-gray-700 bg-gray-800 text-white placeholder-gray-500 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]"
                            id="liters" placeholder="e.g., 35.5" step="0.01" type="number" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300" for="cost">Total Cost</label>
                        <div class="relative mt-1">
                            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                                <span class="text-gray-400 sm:text-sm">$</span>
                            </div>
                            <input
                                class="form-input block w-full rounded-md border-gray-700 bg-gray-800 text-white placeholder-gray-500 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)] pl-7"
                                id="cost" placeholder="e.g., 45.75" step="0.01" type="number" />
                        </div>
                    </div>
                    <button
                        class="w-full rounded-md bg-[var(--primary-color)] py-2 px-4 text-sm font-semibold text-white shadow-sm hover:bg-blue-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-color)]"
                        type="submit">
                        Add Entry
                    </button>
                </form>
            </div>
            <div class="ml-80 flex-1 p-8">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold">Fuel Analytics</h1>
                    <p class="mt-1 text-gray-400">Track your fuel consumption and analyze efficiency.</p>
                </div>
                <div class="grid grid-cols-1 gap-8 lg:grid-cols-2">
                    <div class="rounded-lg border border-gray-800 bg-gray-800/50 p-6 shadow-lg">
                        <h3 class="text-lg font-semibold">Mileage Efficiency</h3>
                        <p class="mt-1 text-4xl font-bold">15 km/l</p>
                        <div class="mt-2 flex items-baseline gap-2">
                            <span class="text-sm text-gray-400">vs. last 3 months</span>
                            <span class="flex items-center text-sm font-medium text-green-500">
                                <svg class="mr-1 h-4 w-4" fill="currentColor" viewBox="0 0 20 20"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path clip-rule="evenodd"
                                        d="M10 17a.75.75 0 01-.75-.75V5.612L6.03 8.97a.75.75 0 01-1.06-1.06l4.25-4.25a.75.75 0 011.06 0l4.25 4.25a.75.75 0 11-1.06 1.06L10.75 5.612V16.25A.75.75 0 0110 17z"
                                        fill-rule="evenodd"></path>
                                </svg>
                                5%
                            </span>
                        </div>
                        <div class="mt-6 h-48">
                            <svg class="h-full w-full" fill="none" preserveAspectRatio="none" viewBox="0 0 472 150"
                                xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient gradientUnits="userSpaceOnUse" id="mileage-gradient" x1="0" x2="0"
                                        y1="0" y2="150">
                                        <stop stop-color="#1173d4" stop-opacity="0.5"></stop>
                                        <stop offset="1" stop-color="#111827" stop-opacity="0"></stop>
                                    </linearGradient>
                                </defs>
                                <path
                                    d="M0 109C18.15 109 18.15 21 36.31 21s36.3 20 54.46 20 18.16 52 36.31 52 18.15-60 36.3-60 18.16 68 36.31 68 18.15-40 36.3-40 18.16-16 36.31-16 18.15 76 36.3 76 18.16 28 36.31 28 18.15-148 36.3-148 18.16 80 36.31 80 18.15 48 36.3 48 18.16-104 36.31-104V150H0Z"
                                    fill="url(#mileage-gradient)"></path>
                                <path
                                    d="M0 109C18.15 109 18.15 21 36.31 21s36.3 20 54.46 20 18.16 52 36.31 52 18.15-60 36.3-60 18.16 68 36.31 68 18.15-40 36.3-40 18.16-16 36.31-16 18.15 76 36.3 76 18.16 28 36.31 28 18.15-148 36.3-148 18.16 80 36.31 80 18.15 48 36.3 48 18.16-104 36.31-104"
                                    stroke="#1173d4" stroke-linecap="round" stroke-width="2"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="rounded-lg border border-gray-800 bg-gray-800/50 p-6 shadow-lg">
                        <h3 class="text-lg font-semibold">Cost per Kilometer</h3>
                        <p class="mt-1 text-4xl font-bold">$0.06/km</p>
                        <div class="mt-2 flex items-baseline gap-2">
                            <span class="text-sm text-gray-400">vs. last 3 months</span>
                            <span class="flex items-center text-sm font-medium text-red-500">
                                <svg class="mr-1 h-4 w-4" fill="currentColor" viewBox="0 0 20 20"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path clip-rule="evenodd"
                                        d="M10 3a.75.75 0 01.75.75v10.388l3.22-3.368a.75.75 0 111.06 1.06l-4.25 4.25a.75.75 0 01-1.06 0l-4.25-4.25a.75.75 0 111.06-1.06L9.25 14.138V3.75A.75.75 0 0110 3z"
                                        fill-rule="evenodd"></path>
                                </svg>
                                2%
                            </span>
                        </div>
                        <div class="mt-6 grid h-48 grid-cols-3 items-end gap-4 px-3">
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-full rounded-t-md bg-[var(--primary-color)]" style="height: 50%;"></div>
                                <p class="text-xs font-bold text-gray-400">Jul</p>
                            </div>
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-full rounded-t-md bg-[var(--primary-color)]" style="height: 70%;"></div>
                                <p class="text-xs font-bold text-gray-400">Aug</p>
                            </div>
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-full rounded-t-md bg-[var(--primary-color)]" style="height: 40%;"></div>
                                <p class="text-xs font-bold text-gray-400">Sep</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
